services:
  - type: web
    name: bakehouse-digital-transformation
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bakehouse-enquiries
      mountPath: /var/data
      sizeGB: 1
